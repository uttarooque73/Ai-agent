name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Run live internet web search test
        run: npm run test:live-search
        env:
          LIVE_SEARCH_QUERY: Node.js official website
