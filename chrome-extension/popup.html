<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis Search</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { width: 360px; margin: 0; padding: 16px; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 12px; color: #777; font-size: 12px; line-height: 1.4; }
    form { display: flex; gap: 8px; }
    input { min-width: 0; flex: 1; padding: 9px; border: 1px solid #8888; border-radius: 8px; }
    button { padding: 9px 12px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #status { margin: 12px 0; font-size: 12px; }
    #results { max-height: 360px; overflow: auto; }
    article { padding: 10px 0; border-top: 1px solid #8884; }
    article a { font-size: 13px; font-weight: 650; text-decoration: none; }
    article p { margin: 4px 0 0; color: inherit; opacity: .8; overflow-wrap: anywhere; }
    .hint { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Jarvis Search</h1>
  <p>Keyless Google search in your regular Chrome session.</p>
  <form id="search-form">
    <input id="query" name="query" maxlength="500" placeholder="What do you want to search?" required autofocus>
    <button id="search-button" type="submit">Search</button>
  </form>
  <div id="status" role="status" aria-live="polite">Search results are read from the Google tab opened by this extension.</div>
  <section id="results" aria-label="Search results"></section>
  <p class="hint">If Google shows a consent page or CAPTCHA, complete it in the opened tab and try again. This extension does not bypass challenges.</p>
  <script src="popup.js"></script>
</body>
</html>
